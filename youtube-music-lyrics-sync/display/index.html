<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: rgba(26, 26, 46, 0.92);
    color: #ffffff;
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    padding: 20px;
    user-select: none;
  }

  #song-info {
    font-size: 16px;
    color: #e94560;
    margin-bottom: 10px;
    text-align: center;
    min-height: 24px;
  }

  #sync-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(233, 69, 96, 0.3);
    color: #fff;
    border: 1px solid rgba(233, 69, 96, 0.5);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 13px;
    cursor: pointer;
    z-index: 100;
    transition: background 0.2s;
  }

  #sync-btn:hover {
    background: rgba(233, 69, 96, 0.6);
  }

  #sync-status {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 12px;
    color: #888;
    z-index: 100;
  }

  #lyrics-container {
    text-align: center;
    width: 100%;
    max-width: 700px;
  }

  .lyric-line {
    font-size: 20px;
    color: #888888;
    padding: 8px 16px;
    margin: 4px 0;
    border-radius: 8px;
    transition: all 0.3s ease;
    opacity: 0.6;
  }

  .lyric-line.current {
    font-size: 28px;
    color: #ffffff;
    opacity: 1;
    background: rgba(233, 69, 96, 0.15);
    transform: scale(1.02);
  }

  .lyric-line.past {
    opacity: 0.4;
  }

  #status {
    margin-top: 20px;
    font-size: 18px;
    color: #e94560;
    min-height: 28px;
  }
</style>
</head>
<body>
  <div id="sync-status">Sync: <span id="sync-time">--:--</span></div>
  <button id="sync-btn" onclick="requestSync()">⏱ Sync</button>
  <div id="song-info"></div>
  <div id="lyrics-container"></div>
  <div id="status"></div>

  <script>
    let currentIndex = -1;
    let totalLines = 0;
    let syncRequested = false;
    let songStartTime = 0;

    function setLine(idx, total, text) {
      currentIndex = idx;
      totalLines = total;
      render();
    }

    function setLines(arr) {
      lines = arr;
      totalLines = arr.length;
      render();
    }

    function setSongInfo(text) {
      document.getElementById('song-info').textContent = text;
    }

    function setNotFound(text) {
      document.getElementById('status').textContent = text;
      document.getElementById('lyrics-container').innerHTML = '';
    }

    function setPaused() {
      document.getElementById('status').textContent = '⏸ Paused';
    }

    function setSyncTime(ts) {
      document.getElementById('sync-time').textContent = ts;
    }

    function requestSync() {
      syncRequested = true;
      document.getElementById('status').textContent = '🔄 Syncing...';
    }

    function isSyncRequested() {
      if (syncRequested) {
        syncRequested = false;
        return true;
      }
      return false;
    }

    function render() {
      const container = document.getElementById('lyrics-container');
      const halfWindow = 3;
      let start = Math.max(0, currentIndex - halfWindow);
      let end = Math.min(totalLines, currentIndex + halfWindow + 1);

      if (currentIndex - start < halfWindow) {
        end = Math.min(totalLines, start + halfWindow * 2 + 1);
      }
      if (end - currentIndex < halfWindow + 1) {
        start = Math.max(0, end - halfWindow * 2 - 1);
      }

      let html = '';
      for (let i = start; i < end; i++) {
        let cls = 'lyric-line';
        if (i === currentIndex) cls += ' current';
        else if (i < currentIndex) cls += ' past';
        html += `<div class="${cls}">${lines[i] || ''}</div>`;
      }
      container.innerHTML = html;

      const currentEl = container.querySelector('.current');
      if (currentEl) {
        currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    let lines = [];
  </script>
</body>
</html>
